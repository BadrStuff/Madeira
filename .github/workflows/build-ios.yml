name: Build Madeira IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build Native Dependencies
        run: |
          # Runs native build scripts (Wine, FEX, DXMT PE modules) required before xcodebuild
          chmod +x build/build.sh || true
          for script in build/*/build.sh; do
            if [ -f "$script" ]; then
              echo "Executing $script..."
              bash "$script"
            fi
          done

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Madeira.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/Madeira.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r $GITHUB_WORKSPACE/Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: Madeira.ipa

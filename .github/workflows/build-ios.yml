name: Build Madeira IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install System Dependencies
        run: |
          brew install cmake ninja pkg-config glslang llvm

      - name: Fetch and Install LLVM-MinGW Toolchain
        run: |
          mkdir -p toolchains
          cd toolchains
          curl -L -O https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          tar -xf llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          rm llvm-mingw-20260421-ucrt-macos-universal.tar.xz

      - name: Build Native Dependencies
        run: |
          # Set up LLVM paths for airconv
          LLVM_PATH=$(brew --prefix llvm)
          export PATH="$LLVM_PATH/bin:$PATH"
          export LDFLAGS="-L$LLVM_PATH/lib $LDFLAGS"
          export CPPFLAGS="-I$LLVM_PATH/include $CPPFLAGS"
          export CXXFLAGS="-I$LLVM_PATH/include $CXXFLAGS"

          find . -type f -name "*.sh" -exec chmod +x {} +
          for script in build/*/build.sh; do
            if [ -f "$script" ]; then
              if [[ "$script" == *"d3d11-triangle"* ]]; then
                echo "Skipping $script (test binary requiring Wine)..."
                continue
              fi
              echo "========================================="
              echo "Executing $script..."
              echo "========================================="
              bash "$script"
            fi
          done

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Madeira.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/Madeira.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r $GITHUB_WORKSPACE/Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: Madeira.ipa

name: Build Madeira IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install System Dependencies
        run: |
          brew install cmake ninja pkg-config glslang

      - name: Fetch and Install LLVM-MinGW Toolchain
        run: |
          mkdir -p toolchains
          cd toolchains
          curl -L -O https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          tar -xf llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          rm llvm-mingw-20260421-ucrt-macos-universal.tar.xz

      - name: Fetch LLVM Source (iOS-targeted)
        run: |
          set -euo pipefail
          # Only clone if not already provided as a submodule
          if [ ! -d toolchains/llvm-project/llvm ]; then
            mkdir -p toolchains
            # Match the version DXMT's fork was built against.
            # llvm::Optional was removed in LLVM 16, so this must be <= 15.
            git clone --depth=1 --branch llvmorg-15.0.7 \
              https://github.com/llvm/llvm-project toolchains/llvm-project
          fi
          ls toolchains/llvm-project/llvm/CMakeLists.txt

      - name: Configure LLVM for iOS (headers only, no full build)
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cmake -G Ninja \
            -S toolchains/llvm-project/llvm \
            -B toolchains/llvm-ios-build \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF

          # Sanity: the generated Config headers should now exist
          ls toolchains/llvm-ios-build/include/llvm/Config/llvm-config.h

      - name: Build Native Dependencies
        run: |
          set -euo pipefail
          find . -type f -name "*.sh" -exec chmod +x {} +

          SCRIPT="build/dxmt-ios/build.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "Missing $SCRIPT" >&2
            exit 1
          fi

          echo "========================================="
          echo "Executing $SCRIPT ..."
          echo "========================================="
          bash "$SCRIPT"

      - name: Inspect airconv Error Logs (Debug)
        if: always()
        run: |
          echo "=== Printing airconv build errors ==="
          if [ -d "build/dxmt-ios/obj" ]; then
            for err_file in build/dxmt-ios/obj/*.err; do
              if [ -f "$err_file" ]; then
                echo "--- $err_file ---"
                head -n 40 "$err_file"
              fi
            done
          else
            echo "Error directory not found!"
          fi

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Madeira.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/Madeira.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r $GITHUB_WORKSPACE/Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: Madeira.ipa

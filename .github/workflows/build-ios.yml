name: Build Madeira Unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install System Dependencies
        run: |
          brew install cmake ninja pkg-config glslang

      - name: Fetch and Install LLVM-MinGW Toolchain
        run: |
          mkdir -p toolchains
          cd toolchains
          curl -L -O https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          tar -xf llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          rm llvm-mingw-20260421-ucrt-macos-universal.tar.xz

      - name: Fetch LLVM 15 Source
        run: |
          set -euo pipefail
          if [ ! -d toolchains/llvm-project/llvm ]; then
            git clone --depth=1 --branch llvmorg-15.0.7 \
              https://github.com/llvm/llvm-project toolchains/llvm-project
          fi
          test -f toolchains/llvm-project/llvm/CMakeLists.txt

      - name: Configure LLVM for iOS
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cmake -G Ninja \
            -S toolchains/llvm-project/llvm \
            -B toolchains/llvm-ios-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF
          test -f toolchains/llvm-ios-build/include/llvm/Config/llvm-config.h

      - name: Generate LLVM TableGen Headers
        run: |
          set -euo pipefail
          cmake --build toolchains/llvm-ios-build --target intrinsics_gen -j 4
          test -f toolchains/llvm-ios-build/include/llvm/IR/Attributes.inc

      - name: Build Native Dependencies
        run: |
          set -euo pipefail
          find . -type f -name "*.sh" -exec chmod +x {} +
          
          SCRIPT="build/dxmt-ios/build.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "Missing $SCRIPT — submodule checkout may have failed." >&2
            exit 1
          fi
          
          bash "$SCRIPT"

      - name: Inspect Build Errors (Debug)
        if: always()
        run: |
          if [ -d "build/dxmt-ios/obj" ]; then
            for err_file in build/dxmt-ios/obj/*.err; do
              if [ -f "$err_file" ] && [ -s "$err_file" ]; then
                echo "--- $err_file ---"
                head -n 40 "$err_file"
              fi
            done
          fi

      - name: Build Unsigned Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Madeira.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Extract and Package Unsigned IPA
        run: |
          set -euo pipefail
          
          # Extract the .app from the archive
          mkdir -p "$RUNNER_TEMP/Payload"
          if [ -d "$RUNNER_TEMP/Madeira.xcarchive/Products/Applications/Madeira.app" ]; then
            cp -r "$RUNNER_TEMP/Madeira.xcarchive/Products/Applications/Madeira.app" "$RUNNER_TEMP/Payload/"
          else
            echo "Error: Madeira.app not found in archive"
            find "$RUNNER_TEMP/Madeira.xcarchive" -name "*.app" -type d
            exit 1
          fi
          
          # Create the unsigned IPA (which is just a zip with Payload directory)
          cd "$RUNNER_TEMP"
          zip -r "$GITHUB_WORKSPACE/Madeira-unsigned.ipa" Payload

      - name: Verify IPA
        run: |
          set -euo pipefail
          if [ ! -f "Madeira-unsigned.ipa" ]; then
            echo "Error: IPA file not created"
            exit 1
          fi
          echo "IPA created successfully:"
          ls -lh Madeira-unsigned.ipa
          unzip -l Madeira-unsigned.ipa | head -20

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-ipa
          path: Madeira-unsigned.ipa
          retention-days: 30

name: Build Madeira IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install System Dependencies
        run: |
          brew install cmake ninja pkg-config glslang llvm

      - name: Fetch and Install LLVM-MinGW Toolchain
        run: |
          mkdir -p toolchains
          cd toolchains
          curl -L -O https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          tar -xf llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          rm llvm-mingw-20260421-ucrt-macos-universal.tar.xz

      - name: Patch Build Script for LLVM Paths
        run: |
          LLVM_PREFIX=$(brew --prefix llvm)
          SCRIPT="build/dxmt-ios/build.sh"
          
          echo "Patching $SCRIPT to include Homebrew LLVM paths..."
          
          # Backup original
          cp "$SCRIPT" "${SCRIPT}.bak"
          
          # Inject LLVM_INCLUDE and LLVM_LIB vars at the top of the script
          # and ensure CXXFLAGS includes them. This handles cases where the script
          # ignores external env vars or resets them.
          sed -i '' "1s|^|export LLVM_PREFIX=\"$LLVM_PREFIX\"\nexport CXXFLAGS=\"-I$LLVM_PREFIX/include -std=c++20 -stdlib=libc++ \$CXXFLAGS\"\nexport LDFLAGS=\"-L$LLVM_PREFIX/lib -stdlib=libc++ \$LDFLAGS\"\n|" "$SCRIPT"
          
          echo "Patched script header:"
          head -n 10 "$SCRIPT"

      - name: Build Native Dependencies
        run: |
          # Locate Homebrew LLVM path dynamically
          LLVM_PREFIX=$(brew --prefix llvm)
          
          # Force the use of Homebrew LLVM compilers
          export CC="$LLVM_PREFIX/bin/clang"
          export CXX="$LLVM_PREFIX/bin/clang++"
          
          # Export LLVM pathing for build scripts and compilers
          export PATH="$LLVM_PREFIX/bin:$PATH"
          export LLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm"
          export LLVM_CONFIG="$LLVM_PREFIX/bin/llvm-config"
          
          # Ensure C++20 and correct standard library
          export CXXFLAGS="-std=c++20 -stdlib=libc++ -I$LLVM_PREFIX/include $CXXFLAGS"
          export CFLAGS="-I$LLVM_PREFIX/include $CFLAGS"
          export LDFLAGS="-L$LLVM_PREFIX/lib -stdlib=libc++ -Wl,-rpath,$LLVM_PREFIX/lib $LDFLAGS"

          # Debug: Print compiler versions to ensure we are using the right ones
          echo "Using CC: $(which $CC)"
          echo "Using CXX: $(which $CXX)"
          $CXX --version

          find . -type f -name "*.sh" -exec chmod +x {} +
          
          # Execute the specific dxmt-ios build script with forced env vars
          SCRIPT="build/dxmt-ios/build.sh"
          if [ -f "$SCRIPT" ]; then
            echo "========================================="
            echo "Executing $SCRIPT with forced LLVM env..."
            echo "========================================="
            env \
              CC="$CC" \
              CXX="$CXX" \
              CXXFLAGS="$CXXFLAGS" \
              CFLAGS="$CFLAGS" \
              LDFLAGS="$LDFLAGS" \
              LLVM_DIR="$LLVM_DIR" \
              LLVM_CONFIG="$LLVM_CONFIG" \
              PATH="$PATH" \
              bash "$SCRIPT"
          fi

      - name: Inspect airconv Error Logs (Debug)
        if: always()
        run: |
          echo "=== Printing airconv build errors ==="
          if [ -d "build/dxmt-ios/obj" ]; then
            for err_file in build/dxmt-ios/obj/*.err; do
              if [ -f "$err_file" ]; then
                echo "--- $err_file ---"
                head -n 50 "$err_file"
              fi
            done
          else
            echo "Error directory not found!"
          fi

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Madeira.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/Madeira.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r $GITHUB_WORKSPACE/Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: Madeira.ipa

name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Dependencies
        run: |
          brew install cmake ninja pkg-config bison flex

      - name: Build Native Submodules & Dependencies
        run: |
          # If Madeira provides a setup script, invoke it here
          chmod +x ./build.sh || true
          if [ -f ./build.sh ]; then
            ./build.sh
          fi

      - name: Build App & Archive
        run: |
          xcodebuild archive \
            -workspace Madeira.xcworkspace \
            -scheme Madeira \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Madeira.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r $RUNNER_TEMP/Madeira.xcarchive/Products/Applications/*.app Payload/
          zip -r Madeira.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned
          path: Madeira.ipa
